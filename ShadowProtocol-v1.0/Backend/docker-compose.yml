services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadow
      POSTGRES_DB: shadow_protocol
    ports: ["5432:5432"]
    volumes: ["shadow_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  shadow_pg:
