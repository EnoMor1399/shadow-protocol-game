name: Import Shadow Protocol v0.9 source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/shadow-protocol-v09/part-16.b64'
      - '.github/workflows/import-shadow-protocol-v09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find .bootstrap/shadow-protocol-v09 -maxdepth 1 -type f -name 'part-*.b64' | sort -V)
          if [ "${#PARTS[@]}" -ne 17 ]; then
            echo "Expected 17 bootstrap parts, found ${#PARTS[@]}" >&2
            exit 1
          fi
          cat "${PARTS[@]}" > /tmp/shadow-protocol-v09.b64.broken
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/shadow-protocol-v09.b64.broken')
          s = p.read_text()
          if len(s) != 118111:
              raise SystemExit(f'Unexpected bootstrap stream length: {len(s)}')
          repaired = s[:31931] + 'P' + s[31931:]
          if len(repaired) != 118112:
              raise SystemExit('Repair length mismatch')
          Path('/tmp/shadow-protocol-v09.b64').write_text(repaired)
          PY
          base64 --decode /tmp/shadow-protocol-v09.b64 > /tmp/shadow-protocol-v09.tar.xz
          echo '02234715b9672bae72db52305d8774c2f90507b0874fdab4cb6dae443d14c2f9  /tmp/shadow-protocol-v09.tar.xz' | sha256sum -c -
          mkdir -p ShadowProtocol-v0.9
          tar -xJf /tmp/shadow-protocol-v09.tar.xz -C ShadowProtocol-v0.9
          FILE_COUNT=$(find ShadowProtocol-v0.9 -type f | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -lt 78 ]; then
            echo "Expected at least 78 project files after extraction, found $FILE_COUNT" >&2
            exit 1
          fi

      - name: Remove bootstrap payload and importer
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/import-shadow-protocol-v09.yml

      - name: Commit reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Complete Shadow Protocol v0.9 source import'
          git push origin HEAD:main
